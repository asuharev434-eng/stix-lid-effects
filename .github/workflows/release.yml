name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Tests including GPU rendering
        run: swift test
      - name: Build application
        run: ./build.sh
      - name: Package application preserving executable permissions
        run: ditto -c -k --keepParent "build/STIX Lid Effects.app" build/STIX-Lid-Effects.zip
      - uses: actions/upload-artifact@v4
        with:
          name: STIX-Lid-Effects
          path: build/STIX-Lid-Effects.zip
          retention-days: 7
